[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hea-forecast"
version = "0.1.0"
description = "Chemistry-aware temporal forecasting of HEA electrocatalysis literature"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<20",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
chemistry = [
  "pymatgen>=2024.5",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
hea-forecast = "hea_forecast.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hea_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

